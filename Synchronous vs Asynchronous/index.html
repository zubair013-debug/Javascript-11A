<body class="h-full flex flex-col font-sans antialiased text-slate-200 bg-slate-950 overflow-x-hidden">

  <!-- Top Navigation Header -->

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-book-bookmark text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white flex items-center gap-2">
            PerpusTech <span class="text-xs font-normal px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Digital Library</span>
          </h1>
          <p class="text-xs text-slate-400">Sistem Manajemen Perpustakaan Modern</p>
        </div>
      </div>
      
      <!-- Tab Navigation Buttons -->

        <button id="nav-catalog-btn" onclick="switchTab('catalog')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 bg-indigo-600 text-white shadow-md">
          <i class="fa-solid fa-books mr-1.5"></i>Katalog Buku
        </button>
        <button id="nav-borrowed-btn" onclick="switchTab('borrowed')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-900 transition-all duration-200 flex items-center gap-1.5">
          <i class="fa-solid fa-clock-rotate-left"></i>Buku Dipinjam
          <span id="borrowed-badge" class="ml-1 px-1.5 py-0.2 text-[10px] bg-indigo-500/20 text-indigo-300 rounded-full border border-indigo-500/30">0</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">

    <!-- Top Dashboard Stats Banner -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center gap-4 shadow-lg">
        <div class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 text-xl">
          <i class="fa-solid fa-book"></i>
        </div>
        <div>
          <div class="text-xs text-slate-400 font-medium">Total Koleksi Buku</div>
          <div class="text-2xl font-bold text-white mt-0.5" id="stat-total">0</div>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center gap-4 shadow-lg">
        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 text-xl">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <div>
          <div class="text-xs text-slate-400 font-medium">Tersedia Digunakan</div>
          <div class="text-2xl font-bold text-emerald-400 mt-0.5" id="stat-available">0</div>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center gap-4 shadow-lg">
        <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-xl">
          <i class="fa-solid fa-handshake"></i>
        </div>
        <div>
          <div class="text-xs text-slate-400 font-medium">Sedang Dipinjam</div>
          <div class="text-2xl font-bold text-amber-400 mt-0.5" id="stat-borrowed">0</div>
        </div>
      </div>
    </div>

    <!-- TAB 1: KATALOG BUKU -->
    <div id="tab-catalog" class="space-y-6">
      
      <!-- Catalog Management Bar -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl flex flex-col md:flex-row gap-4 items-center justify-between">
        
        <!-- Search & Filter -->

          <div class="relative flex-1 min-w-[200px]">
            <i class="fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
            <input type="text" id="catalog-search" oninput="renderCatalog()" placeholder="Cari judul buku atau penulis..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
          </div>

            <option value="ALL">Semua Kategori</option>
            <option value="Teknologi">Teknologi</option>
            <option value="Sains">Sains</option>
            <option value="Fiksi">Fiksi</option>
            <option value="Sejarah">Sejarah</option>
            <option value="Bisnis">Bisnis</option>
          </select>
        </div>

        <!-- Action Add Book Button -->
        <button onclick="openAddBookModal()" class="w-full md:w-auto px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">

    <!-- TAB 2: DAFTAR BUKU DIPINJAM -->

          <h2 class="text-base font-semibold text-white flex items-center gap-2">
            <i class="fa-solid fa-list-check text-indigo-400"></i> Daftar Transaksi & Buku Dipinjam
          </h2>

        </div>

        <div id="borrowed-list-container">

        </div>
      </div>
    </div>

  </main>

  <!-- MODAL 1: Borrow Book Form Modal -->
  <div id="borrow-book-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          <i class="fa-solid fa-hand-holding-hand text-indigo-400"></i> Form Peminjaman Buku
        </h3>
        <button onclick="closeBorrowModal()" class="text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="borrow-book-form" onsubmit="submitBorrowForm(event)" class="space-y-4">
        <input type="hidden" id="borrow-book-id">
        
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Judul Buku</label>
          <input type="text" id="borrow-book-title" readonly class="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-3 py-2 text-xs text-indigo-300 font-semibold focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Nama Peminjam</label>
          <input type="text" id="borrow-user-name" required placeholder="Masukkan nama lengkap pendaftar..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Durasi Peminjaman (Hari)</label>
          <select id="borrow-duration" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
            <option value="3">3 Hari</option>
            <option value="7" selected>7 Hari</option>
            <option value="14">14 Hari</option>
            <option value="30">30 Hari</option>
          </select>

            Batal
          </button>
          <button type="submit" id="btn-submit-borrow" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold flex items-center gap-2 transition-all">
            <span>Konfirmasi Pinjam</span>
          </button>
        </div>
      </form>
    </div>
  </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-indigo-400"></i> Tambah Buku Baru
        </h3>
        <button onclick="closeAddBookModal()" class="text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="add-book-form" onsubmit="handleAddBook(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Judul Buku</label>

        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Penulis / Pengarang</label>
          <input type="text" id="input-author" required placeholder="Contoh: Marijn Haverbeke" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Kategori</label>
            <select id="input-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="Teknologi">Teknologi</option>
              <option value="Sains">Sains</option>
              <option value="Fiksi">Fiksi</option>

              <option value="Bisnis">Bisnis</option>

          </div>
          <div>

            <input type="number" id="input-year" required value="2024" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Ringkasan Singkat</label>
          <textarea id="input-summary" rows="2" placeholder="Tulis deskripsi singkat buku..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
          <button type="button" onclick="closeAddBookModal()" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800">
            Batal
          </button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold">
            Simpan Buku
          </button>

    </div>
  </div>

  <script>

  id: 6, 
  title: 'Filosofi Teras', 
  author: 'Henry Manampiring',

  year: 2018, 
  available: true, 
  borrower: null,
  dueDate: null,
  summary: 'Panduan praktis penerapan filsafat Stoisisme (Stoik) kuno dari Yunani-Romawi untuk membantu masyarakat modern mengatasi emosi negatif, cemas, berprasangka buruk, serta membangun mental tangguh dan damai.',

    author: 'James Clear',

    /* ==========================================================================
       UI UTILITIES & NOTIFICATIONS
       ========================================================================== */
    function showToast(message, title = 'Notifikasi', type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto bg-slate-900 border border-slate-700 p-3.5 rounded-xl shadow-2xl flex items-start gap-3 transition-all duration-300 translate-x-10 opacity-0';
      
      let icon = 'fa-circle-info text-indigo-400';
      if (type === 'success') icon = 'fa-circle-check text-emerald-400';
      if (type === 'warning') icon = 'fa-triangle-exclamation text-amber-400';
      if (type === 'error') icon = 'fa-circle-xmark text-rose-400';

      toast.innerHTML = `
        <i class="fa-solid ${icon} text-base mt-0.5"></i>
        <div class="flex-1">
          <div class="text-xs font-bold text-white">${title}</div>
          <div class="text-[11px] text-slate-300">${message}</div>
        </div>
      `;

      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-x-10', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-x-10', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function updateStats() {
      const total = books.length;
      const available = books.filter(b => b.available).length;
      const borrowed = total - available;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-available').textContent = available;
      document.getElementById('stat-borrowed').textContent = borrowed;
      document.getElementById('borrowed-badge').textContent = borrowed;
    }

    /* ==========================================================================
       STREAMING_CHUNK: Catalog Rendering Logic...
       ========================================================================== */
    function renderCatalog() {
      const grid = document.getElementById('books-grid');
      const search = document.getElementById('catalog-search').value.toLowerCase();
      const category = document.getElementById('catalog-category').value;

      const filtered = books.filter(book => {
        const matchesSearch = book.title.toLowerCase().includes(search) || book.author.toLowerCase().includes(search);
        const matchesCategory = category === 'ALL' || book.category === category;
        return matchesSearch && matchesCategory;
      });

      updateStats();

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center">
            <i class="fa-solid fa-book-open text-4xl text-slate-700 mb-3"></i>
            <h3 class="text-sm font-bold text-slate-400">Tidak ada buku ditemukan</h3>
            <p class="text-xs text-slate-600 mt-1">Coba kata kunci atau kategori pencarian lain.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(book => `
        <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl p-4 flex flex-col justify-between transition-all duration-300 hover:shadow-xl group">
          <div class="flex gap-4 mb-3">
            <img src="${book.cover}" alt="${book.title}" class="w-24 h-36 object-cover rounded-xl shadow-md group-hover:scale-105 transition-transform shrink-0">
            <div class="flex-1 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between gap-1 mb-1">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${book.category}</span>
                  <span class="text-[10px] text-slate-500 font-mono">${book.year}</span>
                </div>
                <h3 class="font-bold text-sm text-white line-clamp-2">${book.title}</h3>
                <p class="text-xs text-slate-400 mt-0.5">${book.author}</p>
                <p class="text-[11px] text-slate-500 mt-2 line-clamp-2">${book.summary || 'Tidak ada deskripsi.'}</p>
              </div>

              <div>
                ${book.available 
                  ? `<span class="inline-flex items-center gap-1.5 text-[11px] text-emerald-400 font-medium"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Tersedia</span>`
                  : `<span class="inline-flex items-center gap-1.5 text-[11px] text-amber-400 font-medium"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> Dipinjam</span>`
                }
              </div>
            </div>
          </div>

          <div class="pt-2 border-t border-slate-800/80">
            ${book.available 
              ? `<button onclick="openBorrowModal(${book.id})" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition-all flex items-center justify-center gap-1.5 shadow-md shadow-indigo-600/10">
                  <i class="fa-solid fa-hand-holding-hand"></i> Pinjam Buku
                 </button>`
              : `<button disabled class="w-full py-2 bg-slate-800/50 text-slate-500 rounded-xl text-xs font-semibold cursor-not-allowed flex items-center justify-center gap-1.5">
                  <i class="fa-solid fa-lock"></i> Sedang Dipinjam
                 </button>`
            }
          </div>
        </div>
      `).join('');
    }

    /* ==========================================================================
       STREAMING_CHUNK: Borrowed Books List Rendering...
       ========================================================================== */
    function renderBorrowedList() {
      const container = document.getElementById('borrowed-list-container');
      const borrowedBooks = books.filter(b => !b.available);

      if (borrowedBooks.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-8 text-center">
            <i class="fa-solid fa-circle-check text-3xl text-emerald-500/40 mb-2"></i>
            <p class="text-xs text-slate-400 font-medium">Saat ini tidak ada buku yang sedang dipinjam.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="bg-slate-950 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
              <tr>
                <th class="p-3">Buku</th>
                <th class="p-3">Nama Peminjam</th>
                <th class="p-3">Tenggat Waktu</th>
                <th class="p-3 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800/60">
              ${borrowedBooks.map(book => `
                <tr class="hover:bg-slate-950/40 transition-colors">
                  <td class="p-3 flex items-center gap-3">
                    <img src="${book.cover}" class="w-8 h-12 object-cover rounded shadow">
                    <div>
                      <div class="font-bold text-white">${book.title}</div>
                      <div class="text-[10px] text-slate-500">${book.author}</div>
                    </div>
                  </td>
                  <td class="p-3 font-medium text-indigo-300">
                    <i class="fa-solid fa-user text-[10px] mr-1 text-slate-500"></i>${book.borrower || 'Anonim'}
                  </td>
                  <td class="p-3 text-slate-400 font-mono">
                    <i class="fa-solid fa-calendar-day text-[10px] mr-1 text-amber-400"></i>${book.dueDate || '7 Hari'}
                  </td>
                  <td class="p-3 text-right">
                    <button id="btn-return-${book.id}" onclick="handleReturnBook(${book.id})" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg font-semibold text-xs transition-all inline-flex items-center gap-1.5">
                      <i class="fa-solid fa-rotate-left"></i> Kembalikan
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    /* ==========================================================================
       STREAMING_CHUNK: Asynchronous Actions (Borrow & Return)...
       ========================================================================== */
    function openBorrowModal(bookId) {
      const book = books.find(b => b.id === bookId);
      if (!book) return;

      document.getElementById('borrow-book-id').value = book.id;
      document.getElementById('borrow-book-title').value = book.title;
      document.getElementById('borrow-user-name').value = '';
      document.getElementById('borrow-book-modal').classList.remove('hidden');
    }

    function closeBorrowModal() {
      document.getElementById('borrow-book-modal').classList.add('hidden');
    }

    // Async Transaction: Borrow Book
    async function submitBorrowForm(e) {
      e.preventDefault();
      
      const bookId = parseInt(document.getElementById('borrow-book-id').value);
      const borrowerName = document.getElementById('borrow-user-name').value;
      const durationDays = document.getElementById('borrow-duration').value;
      const book = books.find(b => b.id === bookId);

      if (!book) return;

      const submitBtn = document.getElementById('btn-submit-borrow');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Memproses Async...`;

      try {
        // Simulated Async API Request delay (Promise)
        await new Promise((resolve) => setTimeout(resolve, 1500));

        // Calculate due date
        const today = new Date();
        today.setDate(today.getDate() + parseInt(durationDays));
        const formattedDate = today.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

        book.available = false;
        book.borrower = borrowerName;
        book.dueDate = formattedDate;

        closeBorrowModal();
        renderCatalog();
        renderBorrowedList();
        showToast(`Buku "${book.title}" berhasil dipinjam oleh ${borrowerName}.`, "Transaksi Berhasil", "success");
      } catch (err) {
        showToast("Terjadi kesalahan saat memproses transaksi.", "Gagal", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Konfirmasi Pinjam</span>`;
      }
    }

    // Async Transaction: Return Book
    async function handleReturnBook(bookId) {
      const book = books.find(b => b.id === bookId);
      if (!book) return;

      const btn = document.getElementById(`btn-return-${bookId}`);
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Memproses...`;
      }

      // Simulated Async API processing delay
      await new Promise(resolve => setTimeout(resolve, 1200));

      book.available = true;
      book.borrower = null;
      book.dueDate = null;

      renderCatalog();
      renderBorrowedList();
      showToast(`Buku "${book.title}" telah dikembalikan ke stok perpustakaan.`, "Pengembalian Selesai", "success");
    }

    /* ==========================================================================
       STREAMING_CHUNK: Modal Add Book & Navigation Switcher...
       ========================================================================== */
    function openAddBookModal() {
      document.getElementById('add-book-modal').classList.remove('hidden');
    }

    function closeAddBookModal() {
      document.getElementById('add-book-modal').classList.add('hidden');
    }

    function handleAddBook(e) {
      e.preventDefault();
      const title = document.getElementById('input-title').value;
      const author = document.getElementById('input-author').value;
      const category = document.getElementById('input-category').value;
      const year = parseInt(document.getElementById('input-year').value);
      const summary = document.getElementById('input-summary').value;

      const newBook = {
        id: Date.now(),
        title,
        author,
        category,
        year,
        summary,
        available: true,
        borrower: null,
        dueDate: null,
        cover: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6tQH1SXaf0uYYVg4TVMvpCBrK-Zd4TKAoPAEYyFxOPA&s=10'
      };

      books.unshift(newBook);
      renderCatalog();
      closeAddBookModal();
      document.getElementById('add-book-form').reset();
      showToast(`Buku "${title}" berhasil ditambahkan ke katalog perpustakaan.`, "Buku Ditambahkan", "success");
    }

    function switchTab(tab) {
      document.getElementById('tab-catalog').classList.add('hidden');
      document.getElementById('tab-borrowed').classList.add('hidden');

      document.getElementById('nav-catalog-btn').className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-900 transition-all';
      document.getElementById('nav-borrowed-btn').className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-900 transition-all flex items-center gap-1.5';

      if (tab === 'catalog') {
        document.getElementById('tab-catalog').classList.remove('hidden');
        document.getElementById('nav-catalog-btn').className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow-md transition-all';
        renderCatalog();
      } else if (tab === 'borrowed') {
        document.getElementById('tab-borrowed').classList.remove('hidden');
        document.getElementById('nav-borrowed-btn').className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow-md transition-all flex items-center gap-1.5';
        renderBorrowedList();
      }
    }

    // App Initialization
    window.onload = function() {
      renderCatalog();
    };
  </script>
</body>
</html>
