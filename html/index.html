<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perpus Mini - Contoh DOM</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
        padding: 24px;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 4px;
      }
      #status {
        color: #64748b;
        font-size: 13px;
        margin-bottom: 16px;
      }
      form,
      .cari {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      input {
        flex: 1;
        padding: 8px 10px;
        border: 1.5px solid #cbd5e1;
        border-radius: 8px;
      }
      button {
        padding: 7px 12px;
        border: 1.5px solid #93c5fd;
        border-radius: 8px;
        background: #fff;
        color: #2563eb;
        cursor: pointer;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #pesan {
        font-size: 13px;
        min-height: 18px;
        margin-bottom: 8px;
      }
      ul {
        list-style: none;
        display: grid;
        gap: 8px;
      }
      li {
        background: #fff;
        border-radius: 10px;
        padding: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-left: 4px solid #2563eb;
        cursor: pointer;
      }
      li.dipilih {
        box-shadow: 0 0 0 3px #2563eb;
      }
      li.habis {
        border-left-color: #cbd5e1;
        opacity: 0.7;
      }
      .info {
        flex: 1;
        font-size: 14px;
      }
      .info small {
        display: block;
        color: #64748b;
      }
      .kosong {
        text-align: center;
        color: #94a3b8;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>📚 Perpus Mini</h1>
      <p id="status">0 buku</p>

      <!-- 8. Form untuk Ambil Data dan Validasi -->
      <form id="form-buku">
        <input id="input-judul" placeholder="Judul buku" />
        <input
          id="input-stok"
          type="number"
          min="0"
          value="1"
          style="max-width: 70px"
        />
        <button type="submit">Tambah</button>
      </form>
      <p id="pesan"></p>

      <!-- Event Input Pencarian -->
      <div class="cari">
        <input id="input-cari" placeholder="Cari judul..." />
      </div>

      <ul id="daftar-buku"></ul>
    </div>

    <script>
      /* ==========================================================
   CATATAN SINGKAT (tanda [1]-[9] mengikuti poin materi)
   [1] querySelector / querySelectorAll
   [2] textContent / innerHTML / innerText
   [3] getAttribute / setAttribute / style / classList
   [4] createElement / append / prepend / remove
   [5] click / input / submit (preventDefault)
   [6] Bubbling & stopPropagation
   [7] Event Delegation -> 1 listener di parent untuk semua anak
   [8] Ambil Data & Validasi -> ambil nilai form & periksa validitasnya
   [9] DOM Traversal -> Navigasi Parent (closest) & Children (querySelector)
   ========================================================== */

      // Select Elemen DOM
      const form = document.querySelector("#form-buku");
      const inputJudul = document.querySelector("#input-judul");
      const inputStok = document.querySelector("#input-stok");
      const inputCari = document.querySelector("#input-cari");
      const pesan = document.querySelector("#pesan");
      const elStatus = document.querySelector("#status");
      const daftar = document.querySelector("#daftar-buku");

      // Fungsi Pembantu: Membuat Elemen
      function buatItem(judul, stok) {
        const li = document.createElement("li");
        li.dataset.stok = stok;

        const info = document.createElement("div");
        info.className = "info";

        const nama = document.createElement("strong");
        nama.textContent = judul;

        const sisa = document.createElement("small");
        sisa.className = "sisa";

        info.append(nama, sisa);

        const pinjam = document.createElement("button");
        pinjam.textContent = "Pinjam";
        pinjam.className = "pinjam";

        const hapus = document.createElement("button");
        hapus.textContent = "Hapus";
        hapus.className = "hapus";

        li.append(info, pinjam, hapus);
        perbaruiItem(li);
        return li;
      }

      // Fungsi Pembantu: Memperbarui tampilan item berdasarkan stok
      function perbaruiItem(li) {
        const stok = Number(li.getAttribute("data-stok"));
        const pinjam = li.querySelector(".pinjam");
        
        // [9] DOM Traversal Children: Mencari elemen .sisa di dalam li
        li.querySelector(".sisa").textContent =
          stok > 0 ? `Stok: ${stok}` : "Habis";

        li.classList.toggle("habis", stok === 0);

        if (stok === 0) pinjam.setAttribute("disabled", "true");
        else pinjam.removeAttribute("disabled");
      }

      // Fungsi Pembantu: Memperbarui status jumlah buku
      function perbaruiStatus() {
        const total = daftar.querySelectorAll("li:not(.kosong)").length;
        elStatus.textContent = `${total} buku`;
        if (total === 0) {
          daftar.innerHTML = `<li class="kosong"><em>Belum ada buku.</em></li>`;
        }
      }

      function tampilkanPesan(teks, warna) {
        pesan.textContent = teks;
        pesan.style.color = warna;
      }

      // =====================================================
      // 8. Ambil Data dan Validasi
      // =====================================================
      form.addEventListener("submit", (event) => {
        event.preventDefault(); // Mencegah reload halaman

        // 1. Ambil Data dari Input
        const judul = inputJudul.value.trim();
        const stok = Number(inputStok.value);

        // 2. Validasi Data
        if (judul === "") {
          return tampilkanPesan("Judul buku wajib diisi!", "#dc2626");
        }
        if (isNaN(stok) || stok < 0) {
          return tampilkanPesan("Stok tidak valid!", "#dc2626");
        }

        // Hapus pesan kosong jika ada
        daftar.querySelector(".kosong")?.remove();

        // Tambah elemen baru ke DOM
        daftar.prepend(buatItem(judul, stok));
        perbaruiStatus();

        tampilkanPesan(`"${judul}" berhasil ditambahkan.`, "#16a34a");
        form.reset();
      });

      // Event Input: Pencarian Buku
      inputCari.addEventListener("input", () => {
        const kata = inputCari.value.toLowerCase();

        daftar.querySelectorAll("li:not(.kosong)").forEach((li) => {
          // [9] DOM Traversal Children: Mencari elemen <strong> di dalam kartu
          const teksJudul = li.querySelector("strong").textContent.toLowerCase();
          const cocok = teksJudul.includes(kata);
          li.style.display = cocok ? "" : "none";
        });
      });

      // =====================================================
      // 7. Event Delegation & 9. DOM Traversal (Parent - Children)
      // =====================================================
      // [7] Event Delegation: Listener dipasang pada induk (<ul>)
      daftar.addEventListener("click", (event) => {
        // [9] DOM Traversal Parent: Mencari elemen <li> terdekat dari target yang diklik
        const li = event.target.closest("li");
        if (!li || li.classList.contains("kosong")) return;

        // Aksi 1: Tombol Pinjam
        if (event.target.matches(".pinjam")) {
          event.stopPropagation(); // Stop bubbling
          let stokSaatIni = Number(li.dataset.stok);
          if (stokSaatIni > 0) {
            li.dataset.stok = stokSaatIni - 1;
            perbaruiItem(li);
          }
          return;
        }

        // Aksi 2: Tombol Hapus
        if (event.target.matches(".hapus")) {
          event.stopPropagation();
          li.remove(); // Hapus dari DOM
          perbaruiStatus();
          return;
        }

        // Aksi 3: Klik kartu untuk Toggle Select
        li.classList.toggle("dipilih");
      });

      // Data Awal
      [
        ["Laskar Pelangi", 3],
        ["Bumi Manusia", 0],
        ["Atomic Habits", 5],
      ]
        .reverse()
        .forEach(([judul, stok]) => daftar.prepend(buatItem(judul, stok)));

      perbaruiStatus();
    </script>
  </body>
</html>
