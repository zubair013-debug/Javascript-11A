<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Mini Library - DOM</title>

    <style>
      /* Tampilan dasar halaman */
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #eef4f8;
        color: #333;
      }

      /* Judul utama */
      #nama-perpus {
        color: #3f759b;
        margin-bottom: 5px;
      }

      /* Informasi jumlah buku */
      #jumlah-buku {
        color: #666;
        margin-bottom: 20px;
      }

      /* Kartu setiap buku */
      .buku-card {
        background-color: white;
        padding: 15px;
        margin: 12px 0;
        border-radius: 10px;
        border: 1px solid #ccc;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      }

      /* Judul buku */
      .nama-buku {
        margin-top: 0;
        color: #447ba3;
      }

      /* Tombol pinjam */
      .tombol-pinjam {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        background-color: #5c9cca;
        color: white;
        cursor: pointer;
      }

      .tombol-pinjam:hover {
        background-color: #488ab9;
      }

      /* Buku yang sudah dipinjam */
      .sedang-dipinjam {
        background-color: #ffe1e1 !important;
        border: 2px solid #e05555;
      }

      /* Tombol yang sudah tidak bisa digunakan */
      button:disabled {
        background-color: #888;
        color: white;
        cursor: not-allowed;
      }

      /* Bagian cover */
      h3 {
        margin-top: 25px;
      }

      #gambar-cover {
        border-radius: 6px;
        border: 1px solid #ccc;
        margin-top: 5px;
      }
    </style>
  </head>

  <body>
    <h1 id="nama-perpus">⭐Mini Library</h1>
    <p id="jumlah-buku">Jumlah Buku: 0</p>

    <div id="koleksi-buku"></div>

    <h3>Cover Buku:</h3>

    <img id="gambar-cover" src="https://via.placeholder.com/120x150" alt="cover buku" width="120" />

    <script src="/script.js"></script>
  </body>
</html>
